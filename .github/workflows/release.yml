name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: Miller-Media/wordpress-plugin-tests/.github/workflows/release.yml@main
    with:
      plugin: expire-passwords
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit
